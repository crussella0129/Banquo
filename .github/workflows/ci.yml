name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main, 'feat/**']

env:
  CARGO_TERM_COLOR: always
  # CI runners have no usable GPU and no Steam client. The presenter's
  # per-backend test (`host_owned_loop`) and the spike's no-Steam tests skip
  # their GPU-dependent parts when this is set; locally it stays unset.
  BANQUO_ALLOW_HEADLESS: "1"

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Pinned to the toolchain of the local gate so new lints do not drift in.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: clippy, rustfmt

      # Linux: eframe/wgpu + winit's x11/wayland backends need system libs for
      # the build (no GPU needed for tests).
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libgtk-3-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # The workspace gate: the terminal, the presenter and the spike.
      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace
