[package]
name = "banquo-canvas"
version = "0.0.0"
edition = "2021"
description = "Banquo's CPU canvas: RGBA8 surfaces, pygame-compatible rects, rasterising, text and headless rendering. No GPU dependency."
license = "MIT OR Apache-2.0"
repository = "https://github.com/crussella0129/Banquo"
publish = false

[features]
default = ["shaping"]
# Text shaping through harfrust. Off: text falls back to unshaped glyph runs.
shaping = ["dep:harfrust"]

# This crate must stay free of wgpu/winit/eframe/egui and of banquo-presenter:
# headless rendering runs in CI with no GPU.
[dependencies]
png = "0.18"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
harfrust = { version = "0.15", optional = true }

[dev-dependencies]
sha2 = "0.11"
